[package]
name = "sorter"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bytesize = "1.2.0"
clap = { version = "4.5", features = ["derive"] }
memchr = "2.5.0"
rayon = "1.7.0"
self_cell = "1.0.1"
signal-hook = "0.3"
tempfile = "3.7.1"
threadpool = "1.8.1"

[profile.release]
debug = true
